components:
  schemas:
    Envelope:
      type: "object"
      additionalProperties: false
      required:
        - "eventId"
        - "eventType"
        - "schemaVersion"
        - "occurredAt"
        - "correlationId"
        - "producer"
        - "tenantId"
        - "aggregateType"
        - "aggregateId"
        - "aggregateVersion"
        - "data"
      properties:
        eventId:
          type: "string"
          format: "uuid"
        eventType:
          type: "string"
        schemaVersion:
          type: "integer"
        occurredAt:
          type: "string"
          format: "date-time"
        correlationId:
          type: "string"
        producer:
          type: "string"
        tenantId:
          type: "string"
          format: "uuid"
        aggregateType:
          type: "string"
        aggregateId:
          type: "string"
          format: "uuid"
        aggregateVersion:
          type: "integer"
        traceparent:
          type: "string"
        data:
          type: "object"
  messages:
    upload_started_v1:
      name: "upload.started.v1"
      title: "upload.started.v1"
      summary: "An upload began processing."
      x-producer: "intake"
      x-consumers:
        - "insight"
      x-ordering: "per aggregate (aggregateVersion)"
      x-delivery: "at-least-once; consumers dedupe on eventId"
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: "object"
            properties:
              eventType:
                const: "upload.started.v1"
              data:
                type: "object"
                additionalProperties: false
                required:
                  - "uploadId"
                  - "code"
                  - "mode"
                  - "rowCount"
                  - "uploadedBy"
                properties:
                  uploadId:
                    type: "string"
                    format: "uuid"
                  code:
                    type: "string"
                    description: "Display code, e.g. INV-00452"
                  mode:
                    type: "string"
                    enum:
                      - "strict"
                      - "mapping"
                  sourceType:
                    type: "string"
                  sourceDetail:
                    type: "string"
                  rowCount:
                    type: "integer"
                  anonymised:
                    type: "boolean"
                  uploadedBy:
                    type: "string"
                    format: "uuid"
    rows_classified_v1:
      name: "rows.classified.v1"
      title: "rows.classified.v1"
      summary: "A batch (≤500) of classified rows is ready. Carries no PII: records pulls contact fields via intake GET /internal/v1/uploads/{uploadId}/rows?batch=."
      x-producer: "intake"
      x-consumers:
        - "records"
        - "insight"
      x-ordering: "per aggregate (aggregateVersion)"
      x-delivery: "at-least-once; consumers dedupe on eventId"
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: "object"
            properties:
              eventType:
                const: "rows.classified.v1"
              data:
                type: "object"
                additionalProperties: false
                required:
                  - "uploadId"
                  - "batchNo"
                  - "rows"
                properties:
                  uploadId:
                    type: "string"
                    format: "uuid"
                  batchNo:
                    type: "integer"
                  anonymised:
                    type: "boolean"
                  migrationApplied:
                    type: "boolean"
                    description: "true when this upload carried a migration_map that records must apply before these rows (CR-006 Z-5)"
                  rows:
                    type: "array"
                    maxItems: 500
                    items:
                      type: "object"
                      additionalProperties: false
                      required:
                        - "rowId"
                        - "externalRef"
                      properties:
                        rowId:
                          type: "string"
                          format: "uuid"
                        externalRef:
                          type: "string"
                          description: "extractor record_id"
                        parentExternalRef:
                          type: "string"
                        splitIndex:
                          type: "string"
                        recordScope:
                          type: "string"
                          enum:
                            - "Property"
                            - "Business"
                            - "Capital"
                            - "Equipment"
                            - "Market Participant"
                            - "Market Signal"
                        side:
                          type: "string"
                          enum:
                            - "Supply"
                            - "Demand"
                            - "None"
                          nullable: true
                        dealTypes:
                          type: "array"
                          items:
                            type: "string"
                          x-vocabulary: "deal_type"
                        market:
                          type: "string"
                          x-vocabulary: "market"
                        segment:
                          type: "string"
                          x-vocabulary: "segment"
                        propertyTypes:
                          type: "array"
                          items:
                            type: "string"
                          x-vocabulary: "property_type"
                        needsReview:
                          type: "boolean"
                        reviewReasonCode:
                          type: "string"
                          enum:
                            - "side_defaulted"
                            - "deal_type_missing"
                            - "side_unclear"
                            - "property_type_missing"
                            - "value_not_translatable"
                            - "model_unavailable"
                            - "low_confidence"
                            - "other"
                        possibleRepeatOf:
                          type: "string"
                        firstSeenDate:
                          type: "string"
                          format: "date"
                        lastSeenDate:
                          type: "string"
                          format: "date"
                        timesSeen:
                          type: "integer"
                        sourceType:
                          type: "string"
                        sourceName:
                          type: "string"
                        sourceDate:
                          type: "string"
                          format: "date"
                        contentHash:
                          type: "string"
    upload_completed_v1:
      name: "upload.completed.v1"
      title: "upload.completed.v1"
      summary: "All batches of an upload were emitted."
      x-producer: "intake"
      x-consumers:
        - "web"
        - "insight"
      x-ordering: "per aggregate (aggregateVersion)"
      x-delivery: "at-least-once; consumers dedupe on eventId"
      payload:
        allOf:
          - $ref: "#/components/schemas/Envelope"
          - type: "object"
            properties:
              eventType:
                const: "upload.completed.v1"
              data:
                type: "object"
                additionalProperties: false
                required:
                  - "uploadId"
                  - "code"
                  - "counts"
                  - "uploadedBy"
                properties:
                  uploadId:
                    type: "string"
                    format: "uuid"
                  code:
                    type: "string"
                    description: "Display code, e.g. INV-00452"
                  counts:
                    type: "object"
                    additionalProperties: false
                    required:
                      - "read"
                      - "accepted"
                      - "rejected"
                      - "needsReview"
                    properties:
                      read:
                        type: "integer"
                      accepted:
                        type: "integer"
                      rejected:
                        type: "integer"
                      needsReview:
                        type: "integer"
                      unchanged:
                        type: "integer"
                  rejectionReasons:
                    type: "object"
                    additionalProperties:
                      type: "integer"
                    description: "error code → count"
                  sourceType:
                    type: "string"
                  sourceDetail:
                    type: "string"
                  uploadedBy:
                    type: "string"
                    format: "uuid"
    upload_failed_v1:
      name: "upload.failed.v1"
      title: "upload.failed.v1"
      summary: "An upload could not be processed."
      x-producer: "intake"
