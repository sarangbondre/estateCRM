                  - "uploadedBy"
                properties:
                  uploadId:
                    type: "string"
                    format: "uuid"
                  code:
                    type: "string"
                    description: "Display code, e.g. INV-00452"
                  reason:
                    type: "string"
                  uploadedBy:
                    type: "string"
                    format: "uuid"
