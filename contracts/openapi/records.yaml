          type: [string, 'null']
          x-vocabulary: sector
        includesProperty:
          type: [string, 'null']
          x-vocabulary: includes_property
        businessDescription:
          type: [string, 'null']
          description: Redacted copy (contacts replaced by placeholders)
        participantRole:
          type: [string, 'null']
          x-vocabulary: participant_role
        signalType:
          type: [string, 'null']
          x-vocabulary: signal_type
        partyType:
          type: [string, 'null']
          x-vocabulary: party_type
        deadlineDate:
          type: [string, 'null']
          format: date
        linkedPropertyId:
          type: [string, 'null']
          format: uuid
        personId:
          type: [string, 'null']
          format: uuid
        assigneeUserId:
          type: [string, 'null']
          format: uuid
        archived: {type: boolean}
        outsideLaunchArea: {type: boolean}
        createdAt: {type: string, format: date-time}
        version: {type: integer}
      required: [id, code, desk, recordScope, archived, version]
    DeskItemPatch:
      type: object
      properties:
        assigneeUserId:
          type: [string, 'null']
          format: uuid
        archived: {type: boolean}
        note: {type: string, maxLength: 500}
        deadlineDate:
          type: [string, 'null']
          format: date
      additionalProperties: false
    VocabularyRelease:
      type: object
      properties:
        version: {type: string, example: v0.6}
        checksum: {type: string}
        activatedAt: {type: string, format: date-time}
        status:
          type: string
          enum: [active, superseded]
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              values:
                type: array
                items: {type: string}
              multi: {type: boolean}
              bySegment:
                type: object
                additionalProperties:
                  type: array
                  items: {type: string}
          description: field → allowed values (exact BRD spelling)
        recordScopes:
          type: array
          items:
            type: object
            properties:
              value: {type: string}
              allowedDealTypes:
                type: array
                items: {type: string}
              sides:
                type: array
                items: {type: string}
              routedTo: {type: string}
        legacyTerms:
          type: array
          items:
            type: object
            properties:
              term: {type: string}
              field: {type: string}
              maps:
                type: object
                additionalProperties: {type: string}
          description: Mapping-mode translation table (BRD §4.2 'absorbs', §16 legacy terms)
        displayLabels:
          type: array
          items: {type: object}
      required: [version, checksum, activatedAt, fields, recordScopes, legacyTerms]
    VocabularyVersion:
      type: object
      properties:
        version: {type: string}
        checksum: {type: string}
        status: {type: string}
        activatedAt:
          type: [string, 'null']
          format: date-time
      required: [version, checksum, status]
    Micromarket:
      type: object
      properties:
        id: {type: string, format: uuid}
        parentId:
          type: [string, 'null']
          format: uuid
        level:
          type: string
          enum: [zone, micromarket, locality, sub_locality]
        name: {type: string}
        aliases:
          type: array
          items: {type: string}
        city: {type: string}
        inLaunchArea: {type: boolean}
        adjacentIds:
          type: array
          items: {type: string, format: uuid}
