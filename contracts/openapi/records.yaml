  /internal/v1/relay:
    post:
      operationId: recordsRelay
      summary: Relay unpublished outbox rows to consumer pgmq queues
      tags: [Internal]
      description: Reads up to 5,000 outbox rows where published_at is null and enqueues one copy per subscribed consumer queue (subscriptions
        from contracts/asyncapi/events.yaml).
      security:
      - cronSecret: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      responses:
        '200':
          description: Relay run summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: {type: integer}
                  remaining:
                    type: [integer, 'null']
                  durationMs: {type: integer}
                required: [processed, durationMs]
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
      x-roles: []
      x-rate-limit: 'n/a: pg_cron/pg_net only (1 call/min per job plus pokes)'
      x-timeout-ms: 60000
      x-timeout-justification: Background work off the request path; drains process ≤ 100 messages within 50 s (capacity plan §5).
      x-idempotency: 'Safe to repeat: rows are claimed with FOR UPDATE SKIP LOCKED and marked published_at in the same transaction;
        consumers dedupe on eventId.'
      x-emits: []
      x-paginated: false
      x-callers: [pg_cron (every minute), post-commit poke (pg_net)]
  /internal/v1/drain/{queue}:
    post:
      operationId: recordsDrain
      summary: Drain one of this service's pgmq queues
      tags: [Internal]
      security:
      - cronSecret: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - name: queue
        in: path
        required: true
        schema:
          type: string
          enum: [q_records, q_records_photo_fetch]
      responses:
        '200':
          description: Drain run summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: {type: integer}
                  remaining:
                    type: [integer, 'null']
                  durationMs: {type: integer}
                required: [processed, durationMs]
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
      x-roles: []
      x-rate-limit: 'n/a: pg_cron/pg_net only (1 call/min per job plus pokes)'
      x-timeout-ms: 60000
      x-timeout-justification: Background work off the request path; drains process ≤ 100 messages within 50 s (capacity plan §5).
      x-idempotency: 'Safe to repeat: messages are read with a visibility timeout; handlers dedupe on eventId (processed_events) or
        on their own work key; after 5 failed reads a message moves to <queue>_dlq.'
      x-emits: []
      x-paginated: false
      x-callers: [pg_cron (every minute), self re-poke while the queue is non-empty (pg_net)]
  /internal/v1/jobs/{name}:
    post:
      operationId: recordsJob
      summary: Run a scheduled job
      tags: [Internal]
      security:
      - cronSecret: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum: [activate-vocabulary, recompute-launch-area, resolve-pending-repeats, retention-purge, expire-idempotency-keys, reconcile-counters]
      responses:
        '200':
          description: Job run summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed: {type: integer}
                  remaining:
                    type: [integer, 'null']
                  durationMs: {type: integer}
                required: [processed, durationMs]
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
      x-roles: []
      x-rate-limit: 'n/a: pg_cron/pg_net only (1 call/min per job plus pokes)'
      x-timeout-ms: 60000
      x-timeout-justification: Background work off the request path; drains process ≤ 100 messages within 50 s (capacity plan §5).
      x-idempotency: 'Jobs are idempotent: each works from persisted state and a per-job advisory lock prevents overlapping runs (a
        second call returns 409 conflict).'
      x-emits: []
      x-paginated: false
      x-callers: [pg_cron]
