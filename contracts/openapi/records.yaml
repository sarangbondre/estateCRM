# records service API (Stage 4 LLD). Contract-first: change this file before code.
# Rules: docs/04-lld/conventions.md · LLD: docs/04-lld/records.md · Events: contracts/asyncapi/events.yaml
openapi: 3.1.0
info:
  title: 11 Estates CRM — records service
  version: 0.1.0
  description: |-
    Records (S2, HLD §2): system of record for properties, projects, offers, demands, people, enquiries, touches, sightings, source ads, merges, desks, photos, market data, vocabulary and micromarkets. Conventions: docs/04-lld/conventions.md. LLD: docs/04-lld/records.md.
    Contact PII is never returned except by POST /v1/reveals (audit-logged). Extensions on every operation: x-roles, x-rate-limit, x-timeout-ms, x-idempotency, x-emits, x-paginated.
servers:
- {url: 'https://records.internal.11estates.in', description: 'Vercel project records (bom1); called by web, other services (service
    token, rebuilds only) and pg_cron'}
tags:
- {name: Offers}
- {name: Properties}
- {name: Projects}
- {name: Demands}
- {name: People}
- {name: Quick add}
- {name: Contact reveal}
- {name: Enquiries}
- {name: Source ads}
- {name: Merges}
- {name: Desks}
- {name: Reference data}
- {name: Photos}
- {name: Market data}
- {name: Internal}
- {name: Health}
paths:
  /v1/offers:
    get:
      operationId: listOffers
      summary: Search offers by stored fields
      tags: [Offers]
      description: Filters are stored fields only; labels are never filterable (BRD §4.2). Each filter combination is served by an index
        listed in the LLD; unsupported combinations fall back to (tenant_id, updated_at) with a 2 s statement timeout.
      security:
      - staffViaWeb: []
      - serviceToken: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/Limit}
      - {$ref: ./_common.yaml#/components/parameters/Cursor}
      - name: dealType
        in: query
        required: false
        schema: {type: string, x-vocabulary: deal_type}
      - name: market
        in: query
        required: false
        schema: {type: string, x-vocabulary: market}
      - name: segment
        in: query
        required: false
        schema: {type: string, x-vocabulary: segment}
      - name: propertyType
        in: query
        required: false
        schema: {type: string, x-vocabulary: property_type}
      - name: micromarketId
        in: query
        required: false
        schema: {type: string, format: uuid}
        description: Includes descendants in the hierarchy
      - name: locality
        in: query
        required: false
        schema: {type: string}
      - name: city
        in: query
        required: false
        schema: {type: string}
      - name: outsideLaunchArea
        in: query
        required: false
        schema: {type: boolean}
      - name: bhkMin
        in: query
        required: false
        schema: {type: number}
      - name: bhkMax
        in: query
        required: false
        schema: {type: number}
      - name: areaSqftMin
        in: query
        required: false
        schema: {type: number}
      - name: areaSqftMax
        in: query
        required: false
        schema: {type: number}
      - name: priceInrMin
        in: query
        required: false
        schema: {type: integer}
        description: Sale price or monthly rent, per dealType
      - name: priceInrMax
        in: query
        required: false
        schema: {type: integer}
      - name: sourceType
        in: query
        required: false
        schema:
          type: string
          enum: [Channel, Digi, Direct]
      - name: ownerUserId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: needsReview
        in: query
        required: false
        schema: {type: boolean}
      - name: updatedSince
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [updatedAt, -updatedAt, createdAt, -createdAt]
          default: -updatedAt
      - name: recordStage
        in: query
        required: false
        schema:
          type: string
          enum: [Captured, Enriched, Contacted, Verified, Qualified]
      - name: publicationLevel
        in: query
        required: false
        schema:
          type: string
          enum: [Private, Anonymous, Public]
      - name: tenancyStatus
        in: query
        required: false
        schema: {type: string, x-vocabulary: tenancy_status}
      - name: saleMode
        in: query
        required: false
        schema: {type: string, x-vocabulary: sale_mode}
      - name: furnishing
        in: query
        required: false
        schema: {type: string, x-vocabulary: furnishing}
      - name: possessionStatus
        in: query
        required: false
        schema: {type: string, x-vocabulary: possession_status}
      - name: propertyId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: projectId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: sourcedForDemandId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: hasPriceGap
        in: query
        required: false
        schema: {type: boolean}
      - name: code
        in: query
        required: false
        schema: {type: string}
        description: Exact code lookup, e.g. INV-00452
      responses:
        '200':
          description: Page of offers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfferPage'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Safe, read-only.
      x-emits: []
      x-paginated: true
    post:
      operationId: createOffer
      summary: Add an offer to an existing property (US-13)
      tags: [Offers]
      description: 409 deal-type-exists if the property already has an active offer with this dealType (one offer per dealType per property,
        except project configurations).
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IdempotencyKey}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key (24 h, per user+route); replay returns the original status and body; same key + different body
        → 409 idempotency-key-reused.
      x-emits: [offer.created.v1]
      x-paginated: false
  /v1/offers/{idOrCode}:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    get:
      operationId: getOffer
      summary: Get an offer
      tags: [Offers]
      description: A merged offer returns 200 with status merged and mergedIntoId (clients follow it).
      security:
      - staffViaWeb: []
      - serviceToken: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      responses:
        '200':
          description: Offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
          headers:
            ETag:
              schema: {type: string}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Safe, read-only.
      x-emits: []
      x-paginated: false
    patch:
      operationId: patchOffer
      summary: Update offer facts (prices, deal tags, units, revenue share, owner)
      tags: [Offers]
      description: Emits offer.updated.v1 (full facts) and, when any price field changed, offer.price_changed.v1 (previous/current).
        409 offer-merged when patching a merged offer.
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IfMatch}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/OfferPatch'}
          application/json:
            schema: {$ref: '#/components/schemas/OfferPatch'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '412': {$ref: ./_common.yaml#/components/responses/PreconditionFailed}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent, Demand agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: 'JSON Merge Patch, idempotent by design; If-Match: <version> → 412 version-mismatch on mismatch.'
      x-emits: [offer.updated.v1, offer.price_changed.v1]
      x-paginated: false
  /v1/offers/{idOrCode}/record-stage:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    post:
      operationId: changeOfferRecordStage
      summary: Move the offer's Record axis
      tags: [Offers]
      description: Forward moves by agents; backward moves Admin/Manager only. Verified requires ≥ 1 real photo (409 verification-needs-real-photos).
        Same stage → 200 without an event.
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IdempotencyKey}
      - {$ref: ./_common.yaml#/components/parameters/IfMatch}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordStageChange'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '412': {$ref: ./_common.yaml#/components/responses/PreconditionFailed}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent, Demand agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key (24 h, per user+route); replay returns the original status and body; same key + different body
        → 409 idempotency-key-reused.
      x-emits: [offer.record_stage_changed.v1, offer.updated.v1]
      x-paginated: false
  /v1/offers/{idOrCode}/photos:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    put:
      operationId: putOfferPhotos
      summary: Choose which property photos this offer uses (D-5)
      tags: [Offers]
      description: Photos must belong to the offer's property (409 photo-not-on-property).
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IfMatch}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfferPhotos'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '412': {$ref: ./_common.yaml#/components/responses/PreconditionFailed}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent, Demand agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: 'Full replacement, idempotent by design; If-Match: <version> optional.'
      x-emits: [offer.updated.v1]
      x-paginated: false
  /v1/properties:
    get:
      operationId: listProperties
      summary: Search properties by stored fields
      tags: [Properties]
      security:
      - staffViaWeb: []
      - serviceToken: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/Limit}
      - {$ref: ./_common.yaml#/components/parameters/Cursor}
      - name: segment
        in: query
        required: false
        schema: {type: string, x-vocabulary: segment}
      - name: propertyType
        in: query
        required: false
        schema: {type: string, x-vocabulary: property_type}
      - name: micromarketId
        in: query
        required: false
        schema: {type: string, format: uuid}
        description: Includes descendants in the hierarchy
      - name: locality
        in: query
        required: false
        schema: {type: string}
      - name: city
        in: query
        required: false
        schema: {type: string}
      - name: outsideLaunchArea
        in: query
        required: false
        schema: {type: boolean}
      - name: buildingName
        in: query
        required: false
        schema: {type: string}
        description: Normalised prefix match
      - name: projectId
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: code
        in: query
        required: false
        schema: {type: string}
      - name: updatedSince
        in: query
        required: false
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: Page of properties
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyPage'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Safe, read-only.
      x-emits: []
      x-paginated: true
    post:
      operationId: createProperty
      summary: Create a property with 1–4 offers (manual supply entry)
      tags: [Properties]
      description: Runs the property-level duplicate check first (US-07). If candidates score ≥ 0.6 and confirmNewDespiteCandidates
        is false → 409 duplicate-property-suspected with candidates. Emits one offer.created.v1 per offer.
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IdempotencyKey}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PropertyCreated'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
        '409':
          description: duplicate-property-suspected (candidates attached) or another conflict
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemWithCandidates'}
      x-roles: [Admin, Manager, Supply agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key (24 h, per user+route); replay returns the original status and body; same key + different body
        → 409 idempotency-key-reused.
      x-emits: [offer.created.v1]
      x-paginated: false
  /v1/properties/dedup-check:
    post:
      operationId: checkPropertyDuplicates
      summary: Property-level duplicate check without creating anything
      tags: [Properties]
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DedupCheckRequest'}
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DedupCheckResult'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent, Demand agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Read-only computation; no state change, Idempotency-Key not needed.
      x-emits: []
      x-paginated: false
  /v1/properties/{idOrCode}:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    get:
      operationId: getProperty
      summary: Get a property with its offers and parties
      tags: [Properties]
      security:
      - staffViaWeb: []
      - serviceToken: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Safe, read-only.
      x-emits: []
      x-paginated: false
    patch:
      operationId: patchProperty
      summary: Update property facts (areas, location, building, unit details)
      tags: [Properties]
      description: Emits offer.updated.v1 for every active offer of the property (offer facts include property facts). Changing city/locality
        recomputes outsideLaunchArea and micromarket.
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/IfMatch}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/PropertyPatch'}
          application/json:
            schema: {$ref: '#/components/schemas/PropertyPatch'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Property'}
        '400': {$ref: ./_common.yaml#/components/responses/BadRequest}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '409': {$ref: ./_common.yaml#/components/responses/Conflict}
        '412': {$ref: ./_common.yaml#/components/responses/PreconditionFailed}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Supply agent, Demand agent]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: 'JSON Merge Patch, idempotent by design; If-Match: <version> → 412 version-mismatch on mismatch.'
      x-emits: [offer.updated.v1]
      x-paginated: false
  /v1/properties/{idOrCode}/sightings:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    get:
      operationId: listPropertySightings
      summary: Sightings (raw appearances) of the property and its offers
      tags: [Properties]
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/Limit}
      - {$ref: ./_common.yaml#/components/parameters/Cursor}
      responses:
        '200':
          description: Page of sightings, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SightingPage'}
        '401': {$ref: ./_common.yaml#/components/responses/Unauthenticated}
        '403': {$ref: ./_common.yaml#/components/responses/Forbidden}
        '404': {$ref: ./_common.yaml#/components/responses/NotFound}
        '500': {$ref: ./_common.yaml#/components/responses/ServerError}
        '429': {$ref: ./_common.yaml#/components/responses/TooMany}
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 20 req/s per user, burst 40 (enforced at web, conventions §4)
      x-timeout-ms: 2000
      x-idempotency: Safe, read-only.
      x-emits: []
      x-paginated: true
  /v1/properties/{idOrCode}/second-sources:
    parameters:
    - {$ref: ./_common.yaml#/components/parameters/IdOrCode}
    get:
      operationId: listSecondSources
      summary: Other sources advertising the same property, with price gaps
      tags: [Properties]
      security:
      - staffViaWeb: []
      parameters:
      - {$ref: ./_common.yaml#/components/parameters/CorrelationId}
      - {$ref: ./_common.yaml#/components/parameters/Limit}
      - {$ref: ./_common.yaml#/components/parameters/Cursor}
      - name: priceGap
        in: query
        required: false
        schema: {type: boolean}
      - name: status
        in: query
        required: false
        schema:
          type: string
