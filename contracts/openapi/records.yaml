          type: [string, 'null']
          format: uuid
        undoneAt:
          type: [string, 'null']
          format: date-time
      required: [id, aggregateType, survivorId, mergedIds, status, performedAt]
    DeskItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: BIZ-0012}
