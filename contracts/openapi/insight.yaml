# insight — chat, dashboards, exports (S6). LLD: docs/04-lld/insight.md
# Rules: docs/04-lld/conventions.md. Shared components: ./_common.yaml
openapi: 3.1.0
info:
  title: 11 Estates CRM — insight (chat, dashboards, exports)
  version: 0.1.0
  description: |
    Answers questions about the business from a PII-free, event-fed read model (ADR-0004, ADR-0007).
    - **Chat:** the question is redacted, a Hugging Face open-weight model returns a **query plan** chosen from an allowed
      catalogue (never data, never SQL), insight validates it against the catalogue and the vocabulary, runs it on the
      read model and composes the answer **only from query results**. Every data answer carries "How I got this".
      Out-of-scope questions get "I can only answer from 11 Estates data". When the model is unavailable (credits,
      timeout, circuit open) a keyword parser builds the plan and the answer says so.
    - **Proposed actions** come back as cards (R-CHAT-1). insight never executes them: the UI calls
      `targetService`/`targetOperation` through web, and the owning service re-checks permissions.
    - **Dashboards** (BRD §8, US-30; queue tiles from `queue.counts_changed.v1`, R-18) and **exports** (US-32, ≤ 100,000
      rows in production and ≤ 20,000 in the pilot (R-16), 24 h link, audit-logged).
    - Conversations are private to their author (R-17).
servers:
  - url: https://insight.internal.11estates.in
    description: Reached only through web (staff) and pg_cron/pg_net (/internal)
tags:
  - name: chat
  - name: queries
  - name: dashboards
  - name: exports
  - name: internal
  - name: health
security: []
paths:
  # ------------------------------------------------------------------ chat
  /v1/chat/conversations:
    parameters:
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listConversations
      tags: [chat]
      summary: The caller's own conversations (sidebar "Recent chats"), newest first
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/Limit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page sorted by lastMessageAt desc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start a conversation ("+ New chat")
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key accepted (24 h, per user+route); replay returns the same conversation
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 120, description: 'Optional; redacted before storage. Default = first question (redacted, truncated).' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/chat/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getConversation
      tags: [chat]
      summary: One of the caller's conversations (metadata)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200':
          description: Conversation
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete one of the caller's conversations (soft delete now, purged by the nightly job)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: DELETE is idempotent by design (deleting a deleted conversation → 204)
      x-emits: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/chat/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listMessages
      tags: [chat]
      summary: Messages of a conversation, oldest first (stored text is redacted; cards are re-rendered with live state by the UI, R-CHAT-3)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/Limit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Page sorted by createdAt asc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    post:
      operationId: postMessage
      tags: [chat]
      summary: Ask a question; the answer streams back as Server-Sent Events
      description: |
        Response `text/event-stream`. Each SSE frame has `event: <type>` and `data: <JSON>`; `id:` is a sequence number.
        Event types (schemas under components/schemas):
        - `plan` (`PlanEvent`): the validated query plan and the "How I got this" explanation. Sent before the answer text.
        - `token` (`TokenEvent`): a chunk of answer text composed from query results (templates, no model free text).
        - `card` (`CardEvent`): an Answer (C-02), Table (C-03), Dashboard summary (C-20), Notice, Navigate or
          **proposed-action** card (C-04…C-19, C-21).
        - `done` (`DoneEvent`): final; carries the stored messageId, fallback flag and timings.
        - `error` (`ErrorEvent`): terminal problem (RFC 7807 fields); the stream then closes.
        Latency (NFR-7): first `plan`/`token` ≤ 3 s p95, `done` ≤ 15 s p95. The model call has a 2.5 s budget
        (one retry only when the first attempt fails in < 1 s); on timeout the keyword fallback runs.
        Rate limits (at web): 1 concurrent stream per user, 30 messages/min.
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: 'at web: 1 concurrent stream and 30 messages/min per user'
      x-timeout-ms: 15000
      x-timeout-note: 'NFR-7: first token ≤ 3000 ms p95, full answer ≤ 15000 ms p95; server aborts the stream at 15000 ms with event error (code query-timeout)'
      x-idempotency: 'Idempotency-Key accepted (24 h, per user+route). A replay does not re-run the model or the query: it streams the stored message as plan → card(s) → token (whole text) → done. Same key with a different body → 409 idempotency-key-reused.'
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PostMessageRequest' } } }
      responses:
        '200':
          description: SSE stream (see description)
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatStreamEvent' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '413': { description: 'payload-too-large (text > 2,000 characters)', content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/chat/plan-catalogue:
    get:
      operationId: getPlanCatalogue
      tags: [chat]
      summary: The allowed query-plan templates (what the assistant can answer), for transparency and the UI's "How I got this"
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active catalogue version (filtered to templates the caller's role may run)
          content:
            application/json:
              schema:
                type: object
                required: [catalogueVersion, items]
                properties:
                  catalogueVersion: { type: string }
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PlanTemplate' } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ queries (table panel P-07, tile drill-down)
  /v1/queries:
    post:
      operationId: runQuery
      tags: [queries]
      summary: Run a validated plan (no model involved) and return one page of rows — used by "Open in panel" (P-07) and dashboard drill-downs
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only; POST only because the plan is a JSON body)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/QueryPlan' }
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
                cursor: { type: [string, 'null'] }
      responses:
        '200':
          description: One page
          content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/PlanInvalid' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ dashboards
  /v1/dashboards/demand:
    get:
      operationId: getDemandDashboard
      tags: [dashboards]
      summary: 'Demand dashboard (BRD §8): by source, life curve, team queues, exits, classification grid with Wants labels'
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters: &dashFilters
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
        - { name: period, in: query, schema: { type: string, enum: [today, this_week, this_month, this_quarter, last_30_days, custom], default: this_month } }
        - { name: from, in: query, description: Required when period=custom, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: segment, in: query, schema: { type: string }, x-vocabulary: segment }
        - { name: dealType, in: query, schema: { type: string }, x-vocabulary: deal_type }
        - { name: market, in: query, schema: { type: string }, x-vocabulary: market }
        - { name: propertyType, in: query, schema: { type: string }, x-vocabulary: property_type }
        - { name: micromarket, in: query, schema: { type: string, maxLength: 80 } }
        - { name: ownerUserId, in: query, schema: { type: string, format: uuid } }
        - { name: saleMode, in: query, schema: { type: string }, x-vocabulary: sale_mode }
        - { name: tenancyStatus, in: query, schema: { type: string }, x-vocabulary: tenancy_status }
      responses:
        '200': &dashOk
          description: Dashboard
          headers: { Cache-Control: { schema: { type: string }, description: 'private, max-age=30' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/dashboards/supply:
    get:
      operationId: getSupplyDashboard
      tags: [dashboards]
      summary: 'Supply dashboard (BRD §8): stock, life curve, queues and listings, classification grid with For labels, deal-tag filters'
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters: *dashFilters
      responses:
        '200': *dashOk
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/dashboards/scopes:
    get:
      operationId: getScopesDashboard
      tags: [dashboards]
      summary: 'Other scopes (BRD §8): Business and Capital desks, Archive, Network, Watchlist'
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters: *dashFilters
      responses:
        '200': *dashOk
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/dashboards/quality:
    get:
      operationId: getQualityDashboard
      tags: [dashboards]
      summary: 'Data quality (BRD §8): uploads, review queue by review_reason, side checks, source quality'
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters: *dashFilters
      responses:
        '200': *dashOk
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ exports
  /v1/exports:
    parameters:
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listExports
      tags: [exports]
      summary: The caller's exports (Admin sees all), newest first
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/Limit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - { name: status, in: query, schema: { type: string, enum: [queued, running, completed, failed, expired] } }
      responses:
        '200':
          description: Page sorted by createdAt desc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Export' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    post:
      operationId: createExport
      tags: [exports]
      summary: Start a background Excel export of a list or chat answer (≤ 100,000 rows; pilot ≤ 20,000, R-16)
      description: |
        Returns 202 immediately. The job builds an .xlsx in the private `insight-exports` bucket, then emits
        `export.completed.v1` or `export.failed.v1` (web shows the notification) and `audit.recorded.v1` (action
        `export.created`, details: rowCount, includesPii, planId). Contact columns (`includeContacts`) are fetched at
        export time from records `POST /internal/v1/contacts:batch` (serviceToken, ≤ 1,000 ids per call, R-21); the
        read model holds no PII. Allowed for Admin, Manager, Demand agent and Supply agent (Data operator: open question A-I3).
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40); plus 10 exports per hour per user (insight)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key accepted (24 h, per user+route); replay returns the same export job
      x-emits: [export.completed.v1, export.failed.v1, audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateExportRequest' } } }
      responses:
        '202':
          description: Accepted (status queued)
          headers: { Location: { schema: { type: string }, description: '/v1/exports/{exportId}' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { description: 'forbidden, or contacts-not-allowed for the role', content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '422': { description: 'plan-invalid or export-too-large (> 100,000 rows; > 20,000 in the pilot)', content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/exports/{idOrCode}:
    get:
      operationId: getExport
      tags: [exports]
      summary: Status of an export; when completed and not expired, a short-lived signed download URL (file kept 24 h)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdOrCode'
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Export (only the requester or an Admin)
          content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '410': { description: export-expired (older than 24 h; file deleted), content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ internal
  /internal/v1/relay:
    post:
      operationId: relayOutbox
      tags: [internal]
      summary: Publish outbox rows to consumer queues (pg_cron every minute + poke after commit)
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; single-flight via advisory lock)
      x-timeout-ms: 55000
      x-idempotency: Idempotent (FOR UPDATE SKIP LOCKED; published_at set with pgmq.send in one transaction)
      x-emits: [export.completed.v1, export.failed.v1, audit.recorded.v1]
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /internal/v1/drain/{queue}:
    post:
      operationId: drainQueue
      tags: [internal]
      summary: 'Consume a batch: q_insight (domain events → read model), q_insight_exports (export jobs)'
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; every minute + poke)
      x-timeout-ms: 55000
      x-idempotency: Idempotent (processed_events dedupe; per-aggregate version check)
      x-emits: [export.completed.v1, export.failed.v1, audit.recorded.v1]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string, enum: [q_insight, q_insight_exports] } }
        - { name: batch, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /internal/v1/jobs/{name}:
    post:
      operationId: runJob
      tags: [internal]
      summary: Scheduled jobs
      description: |
        - `export-expire` (every 15 min): delete files older than 24 h, mark expired.
        - `conversation-purge` (daily): hard-delete soft-deleted conversations and messages older than the retention (180 days).
        - `rollup-reconcile` (daily 04:30 IST): recompute rollup counters from the base read-model tables and correct drift.
        - `vocabulary-refresh`: fetch the active vocabulary release and micromarkets from records (serviceToken issued by web, R-2) after `vocabulary.released.v1` / `micromarkets.updated.v1`.
        - `idempotency-prune` (hourly).
        - `hf-credit-reset` (monthly): clear the "credits exhausted" flag.
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; single-flight per job)
      x-timeout-ms: 55000
      x-idempotency: Idempotent; resumable from a stored checkpoint
      x-emits: []
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [export-expire, conversation-purge, rollup-reconcile, vocabulary-refresh, idempotency-prune, hf-credit-reset] } }
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /health/live:
    get:
      operationId: live
      tags: [health]
      security: []
      x-roles: [anonymous]
      x-rate-limit: none
      x-timeout-ms: 500
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200': { description: Process up, content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      security: []
      x-roles: [anonymous]
      x-rate-limit: none
      x-timeout-ms: 1000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200': { description: 'DB reachable, migrations current, vocabulary cached; checks.model = ok|degraded (fallback active)', content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: UUID or display code (CONV-…)
      schema: { type: string }
  responses:
    PlanInvalid:
      description: plan-invalid or plan-not-in-catalogue (field-level problems in errors[])
      content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } }
    BatchResult:
      description: Batch processed
      content:
        application/json:
          schema:
            type: object
            required: [processed]
            properties:
              processed: { type: integer }
              failed: { type: integer }
              deadLettered: { type: integer }
              more: { type: boolean }
  schemas:
    Conversation:
      type: object
      required: [conversationId, code, title, createdAt, lastMessageAt]
      properties:
        conversationId: { type: string, format: uuid }
        code: { type: string, description: CONV-… }
        title: { type: string, description: Redacted }
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
        messageCount: { type: integer }
    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000, description: Plain English or Hinglish; may start with a "/" quick action }
        context:
          type: object
          additionalProperties: false
          description: What the user has open, so "this demand" resolves (codes only)
          properties:
            subjectType: { type: string, enum: [offer, demand, project, person, property, match, deal, sourcing_request] }
            subjectCode: { type: string, maxLength: 20 }
    Message:
      type: object
      required: [messageId, role, text, createdAt]
      properties:
        messageId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        text: { type: string, description: 'User text is stored redacted (placeholders like ⟨PHONE_1⟩); assistant text contains no PII' }
        cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
        howIGotThis: { oneOf: [ { $ref: '#/components/schemas/HowIGotThis' }, { type: 'null' } ] }
        fallbackUsed: { type: boolean }
        status: { type: string, enum: [complete, error, refused] }
        createdAt: { type: string, format: date-time }
    # ---- SSE events
    ChatStreamEvent:
      description: One SSE frame's data; `type` equals the SSE `event:` name.
      oneOf:
        - $ref: '#/components/schemas/PlanEvent'
        - $ref: '#/components/schemas/TokenEvent'
        - $ref: '#/components/schemas/CardEvent'
        - $ref: '#/components/schemas/DoneEvent'
        - $ref: '#/components/schemas/ErrorEvent'
      discriminator: { propertyName: type }
    PlanEvent:
      type: object
      required: [type, howIGotThis]
      properties:
        type: { const: plan }
        howIGotThis: { $ref: '#/components/schemas/HowIGotThis' }
    TokenEvent:
      type: object
      required: [type, text]
      properties:
        type: { const: token }
        text: { type: string, maxLength: 400 }
    CardEvent:
      type: object
      required: [type, card]
      properties:
        type: { const: card }
        card: { $ref: '#/components/schemas/Card' }
    DoneEvent:
      type: object
      required: [type, messageId, fallbackUsed]
      properties:
        type: { const: done }
        messageId: { type: string, format: uuid }
        outcome: { type: string, enum: [answered, action_proposed, clarify, refused] }
        fallbackUsed: { type: boolean, description: True when the keyword parser replaced the model }
        model: { type: [string, 'null'], description: 'Model id used for planning, e.g. "Qwen/Qwen2.5-7B-Instruct"; null for rules/fallback' }
        timings:
          type: object
          properties:
            redactMs: { type: integer }
            planMs: { type: integer }
            queryMs: { type: integer }
            firstTokenMs: { type: integer }
            totalMs: { type: integer }
    ErrorEvent:
      type: object
      required: [type, code, title, correlationId]
      properties:
        type: { const: error }
        code: { type: string, enum: [query-timeout, internal, dependency-unavailable, forbidden] }
        title: { type: string }
        detail: { type: string }
        correlationId: { type: string }
    # ---- plans
    PlanFilter:
      type: object
      additionalProperties: false
      required: [field, op, value]
      properties:
        field: { type: string, description: 'A field allowed by the template (stored fields only, never labels)' }
        op: { type: string, enum: [eq, in, gte, lte, between, is_null, not_null] }
        value: { description: 'Scalar, array (in/between) or null; vocabulary fields validated against the active release' }
    QueryPlan:
      type: object
      additionalProperties: false
      required: [planId, templateVersion]
      properties:
        planId: { type: string, description: 'Template name from the catalogue, e.g. list_offers, count_demands, closed_price_stats' }
        templateVersion: { type: integer }
        filters: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PlanFilter' } }
        groupBy: { type: array, maxItems: 2, items: { type: string } }
        metrics:
          type: array
          maxItems: 4
          items:
            type: object
            required: [fn]
            properties:
              fn: { type: string, enum: [count, avg, median, min, max, sum] }
              field: { type: string }
        sort:
          type: array
          maxItems: 2
          items:
            type: object
            required: [field, dir]
            properties:
              field: { type: string }
              dir: { type: string, enum: [asc, desc] }
        period:
          type: object
          properties:
            preset: { type: string, enum: [today, this_week, this_month, this_quarter, last_month, last_30_days, next_60_days, custom] }
            from: { type: string, format: date }
            to: { type: string, format: date }
            field: { type: string, description: 'Date field the period applies to (template default otherwise)' }
        me: { type: boolean, description: 'Restrict to the caller (ownerUserId = caller), e.g. "my follow-ups"' }
    PlanTemplate:
      type: object
      required: [planId, version, description, kind, allowedFilters, maxRows]
      properties:
        planId: { type: string }
        version: { type: integer }
        description: { type: string }
        kind: { type: string, enum: [list, count, group, stats, navigate, export] }
        allowedFilters:
          type: array
          items:
            type: object
            required: [field, ops]
            properties:
              field: { type: string }
              ops: { type: array, items: { type: string } }
              vocabulary: { type: [string, 'null'], description: x-vocabulary field name when controlled }
        allowedGroupBy: { type: array, items: { type: string } }
        allowedMetrics: { type: array, items: { type: string } }
        allowedSort: { type: array, items: { type: string } }
        maxRows: { type: integer }
        roles: { type: array, items: { type: string } }
    HowIGotThis:
      type: object
      required: [plan, description, source, dataAsOf, catalogueVersion, vocabularyVersion, fallbackUsed]
      properties:
        plan: { $ref: '#/components/schemas/QueryPlan' }
        description: { type: string, description: 'Plain English, generated from the plan, e.g. "Offers where deal_type = Lease, segment = Residential, bhk = 2, locality = Andheri West, commercial status Available, counted"' }
        filtersApplied:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              label: { type: string }
              value: { type: string }
        source: { type: string, const: 11 Estates read model (insight) }
        rowCount: { type: integer }
        dataAsOf: { type: string, format: date-time, description: Time of the newest event applied to the read model }
        catalogueVersion: { type: string }
        vocabularyVersion: { type: string }
        fallbackUsed: { type: boolean }
        translatedTerms: { type: array, items: { type: string }, description: 'Legacy terms mapped, e.g. "rent → deal_type Lease"' }
    QueryResult:
      type: object
      required: [columns, rows, nextCursor, howIGotThis]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [key, label, type]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [string, number, integer, date, datetime, boolean, code, label, user, inr], description: "user = staff userId (UI resolves the name via web GET /v1/users); code = display code (opens the record panel)" }
        rows: { type: array, maxItems: 100, items: { type: object, additionalProperties: true } }
        nextCursor: { type: [string, 'null'] }
        howIGotThis: { $ref: '#/components/schemas/HowIGotThis' }
    # ---- cards
    Card:
      oneOf:
        - $ref: '#/components/schemas/AnswerCard'
        - $ref: '#/components/schemas/TableCard'
        - $ref: '#/components/schemas/DashboardSummaryCard'
        - $ref: '#/components/schemas/NoticeCard'
        - $ref: '#/components/schemas/NavigateCard'
        - $ref: '#/components/schemas/ProposedActionCard'
      discriminator: { propertyName: kind }
    AnswerCard:
      type: object
      required: [kind, cardType, cardId, text]
      properties:
        kind: { const: answer }
        cardType: { const: C-02 }
        cardId: { type: string, format: uuid }
        text: { type: string }
        figures:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: number }
              unit: { type: string, enum: [count, inr, inr_per_month, sqft, days, pct] }
    TableCard:
      type: object
      required: [kind, cardType, cardId, result]
      properties:
        kind: { const: table }
        cardType: { const: C-03 }
        cardId: { type: string, format: uuid }
        result: { $ref: '#/components/schemas/QueryResult' }
        exportable: { type: boolean }
    DashboardSummaryCard:
      type: object
      required: [kind, cardType, cardId, dashboard]
      properties:
        kind: { const: dashboard }
        cardType: { const: C-20 }
        cardId: { type: string, format: uuid }
        dashboard: { type: string, enum: [demand, supply, scopes, quality] }
        headline:
          type: array
          items: { $ref: '#/components/schemas/Tile' }
    NoticeCard:
      type: object
      required: [kind, cardId, notice]
      properties:
        kind: { const: notice }
        cardId: { type: string, format: uuid }
        notice: { type: string, enum: [out_of_scope, model_unavailable_keyword_fallback, clarify, no_results, too_many_rows_use_export, not_allowed_for_role, export_cap_reached] }
        text: { type: string }
        suggestions: { type: array, maxItems: 5, items: { type: string } }
    NavigateCard:
      type: object
      required: [kind, cardId, panel]
      description: Opens a panel whose data the UI loads from the owning service (e.g. P-01 My queue from journeys)
      properties:
        kind: { const: navigate }
        cardId: { type: string, format: uuid }
        panel: { type: string, enum: [P-01, P-02, P-03, P-04, P-05, P-06, P-07, P-08] }
        subjectCode: { type: [string, 'null'] }
        targetService: { type: string, enum: [intake, records, journeys, crm-engine, listings, insight, web] }
        targetOperation: { type: string, description: operationId in the owner's OpenAPI }
        params: { type: object, additionalProperties: true }
    ProposedActionCard:
      type: object
      description: |
        A proposed change (R-CHAT-1). Nothing is executed by insight. On click, the UI sends
        `method path` with `payload` (after the user edits/confirms it) through web to `targetService`, adding
        `Idempotency-Key: idempotencyKey`. The owning service validates and re-checks permissions.
      required: [kind, cardType, cardId, title, targetService, targetOperation, method, path, payload, requiresConfirmation, allowedRoles, idempotencyKey, expiresAt]
      properties:
        kind: { const: action }
        cardType: { type: string, enum: [C-04, C-05, C-06, C-07, C-08, C-09, C-10, C-11, C-12, C-13, C-14, C-15, C-16, C-17, C-18, C-19, C-21] }
        cardId: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string, description: 'What will change, in plain English' }
        targetService: { type: string, enum: [intake, records, journeys, crm-engine, listings] }
        targetOperation: { type: string, description: 'operationId in contracts/openapi/<targetService>.yaml (e.g. quickAdd, logCall, setOfferPublication). method + path are authoritative if an operationId is renamed.' }
        method: { type: string, enum: [POST, PUT, PATCH] }
        path: { type: string, description: 'Concrete path, e.g. /v1/demands/DEM-000127/qualify' }
        payload: { type: object, additionalProperties: true, description: 'Prefilled request body (controlled values only). Placeholders from redaction are re-filled from the request-scoped map before streaming and never stored.' }
        editableFields: { type: array, items: { type: string } }
        ifMatch: { type: [string, 'null'], description: 'Row version for PATCH targets (sent as If-Match); null for POST/PUT without a version' }
        requiresConfirmation: { const: true }
        allowedRoles: { type: array, items: { type: string } }
        idempotencyKey: { type: string, format: uuid, description: Pre-generated so a double click cannot apply twice }
        expiresAt: { type: string, format: date-time, description: 'Card goes stale after 30 min; the UI re-fetches live state (R-CHAT-3)' }
    # ---- dashboards
    Tile:
      type: object
      required: [tileId, title]
      properties:
        tileId: { type: string }
        title: { type: string }
        value: { type: [number, 'null'] }
        unit: { type: string, enum: [count, inr, pct, days] }
        breakdown:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: number }
              drillDown: { $ref: '#/components/schemas/QueryPlan' }
        drillDown: { $ref: '#/components/schemas/QueryPlan' }
    GridTile:
      type: object
      description: Classification grid (segment × deal_type, Sale split by market), labels generated
      required: [tileId, title, rows, columns, cells]
      properties:
        tileId: { type: string }
        title: { type: string }
        rows: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string } } } }
        columns: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string } } } }
        cells:
          type: array
          items:
            type: object
            required: [row, column, value]
            properties:
              row: { type: string }
              column: { type: string }
              value: { type: integer }
              label: { type: string, description: 'e.g. "For Rent" / "Wants to Buy, Resale"' }
              drillDown: { $ref: '#/components/schemas/QueryPlan' }
    Dashboard:
      type: object
      required: [dashboard, generatedAt, dataAsOf, sections]
      properties:
        dashboard: { type: string, enum: [demand, supply, scopes, quality] }
        filters: { type: object, additionalProperties: true }
        generatedAt: { type: string, format: date-time }
        dataAsOf: { type: string, format: date-time }
        sections:
          type: array
          items:
            type: object
            required: [sectionId, title, tiles]
            properties:
              sectionId: { type: string, description: 'e.g. demand_by_source, demand_life_curve, demand_team_queues, exits, demand_by_classification' }
              title: { type: string }
              tiles: { type: array, items: { oneOf: [ { $ref: '#/components/schemas/Tile' }, { $ref: '#/components/schemas/GridTile' } ] } }
    # ---- exports
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { $ref: '#/components/schemas/QueryPlan' }
        includeContacts: { type: boolean, default: false }
        fileName: { type: string, maxLength: 80, pattern: '^[A-Za-z0-9 _.-]+$' }
        sourceMessageId: { type: [string, 'null'], format: uuid, description: Chat message the export came from }
    Export:
      type: object
      required: [exportId, code, status, includesContacts, createdAt]
      properties:
        exportId: { type: string, format: uuid }
        code: { type: string, description: EXP-… }
        status: { type: string, enum: [queued, running, completed, failed, expired] }
        estimatedRows: { type: [integer, 'null'] }
        rowCount: { type: [integer, 'null'] }
        includesContacts: { type: boolean }
        fileName: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: completedAt + 24 h }
        downloadUrl: { type: [string, 'null'], format: uri, description: 'Signed URL valid 10 min, minted on each GET while not expired' }
        errorCode: { type: [string, 'null'] }
        requestedBy: { type: string, format: uuid }
  securitySchemes:
    staffViaWeb: { $ref: './_common.yaml#/components/securitySchemes/staffViaWeb' }
    cronSecret: { $ref: './_common.yaml#/components/securitySchemes/cronSecret' }
