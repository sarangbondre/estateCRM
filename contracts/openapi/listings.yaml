        micromarket: { type: [string, 'null'] }
        locality: { type: [string, 'null'] }
        configurations: { type: array, items: { $ref: '#/components/schemas/PublicProjectConfiguration' } }
        possessionDate: { type: [string, 'null'] }
        amenities: { type: array, items: { type: string } }
        floorPlans: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        projectReraNumber: { type: string }
        agentReraNumber: { type: string }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicDemandPost:
      type: object
      required: [publicId, label, dealTypes, agentReraNumber, publishedAt, updatedAt]
      properties:
        publicId: { type: string }
        label: { type: string, description: 'Generated "Wants" label, e.g. "Wants to Lease"' }
        dealTypes: { type: array, items: { type: string, x-vocabulary: deal_type } }
        segment: { type: [string, 'null'], x-vocabulary: segment }
        propertyTypes: { type: array, items: { type: string, x-vocabulary: property_type } }
        micromarkets: { type: array, items: { type: string } }
        areaSqftMin: { type: [number, 'null'] }
        areaSqftMax: { type: [number, 'null'] }
        areaBasis: { $ref: './_common.yaml#/components/schemas/AreaBasis' }
