    ChangePage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ChangeItem' } }
        nextCursor: { type: string, description: Opaque position to resume from; never null }
        hasMore: { type: boolean }
