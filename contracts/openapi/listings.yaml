        rentBandMonthlyInr: { type: [object, 'null'], properties: { min: { type: integer }, max: { type: integer } } }
        timing: { type: [string, 'null'], description: 'Move-in by, month precision (YYYY-MM)' }
        agentReraNumber: { type: string }
