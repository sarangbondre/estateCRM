      security: [{ websiteApiKey: [] }]
      x-roles: [Website client]
      x-rate-limit: 50 req/s, burst 100 per API key
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      x-cache: 'public, s-maxage=20, stale-while-revalidate=10; Vary: X-Api-Key'
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - { name: dealType, in: query, schema: { type: string }, x-vocabulary: deal_type }
        - { name: segment, in: query, schema: { type: string }, x-vocabulary: segment }
        - { name: propertyType, in: query, schema: { type: string }, x-vocabulary: property_type }
        - { name: micromarket, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Page sorted by publishedAt desc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PublicDemandPost' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/changes:
    get:
      operationId: publicListChanges
      tags: [public]
      summary: Change feed (published / updated / upgraded / downgraded / withdrawn) since a cursor or a time
      description: |
        Ordered by a monotonic sequence. Pass `since` = the `nextCursor` of the previous call (preferred) or an ISO
        date-time for the first call. Entries are kept 30 days; an older `since` → 410 `change-feed-expired` (do a full
        resync from the list endpoints). `nextCursor` is never null: it is the position to resume from.
      security: [{ websiteApiKey: [] }]
      x-roles: [Website client]
      x-rate-limit: 50 req/s, burst 100 per API key
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      x-cache: 'public, s-maxage=5; Vary: X-Api-Key'
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
        - { name: since, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Changes after `since`
          content: { application/json: { schema: { $ref: '#/components/schemas/ChangePage' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '410': { description: change-feed-expired, content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ internal (scheduler)
  /internal/v1/relay:
    post:
      operationId: relayOutbox
      tags: [internal]
      summary: Publish unpublished outbox rows to subscribed consumer queues (pg_cron every minute + poke after commit)
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; single-flight via advisory lock)
      x-timeout-ms: 55000
      x-idempotency: Idempotent (FOR UPDATE SKIP LOCKED; published_at set in the same transaction as pgmq.send)
      x-emits: [publication.changed.v1, audit.recorded.v1]
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /internal/v1/drain/{queue}:
    post:
      operationId: drainQueue
      tags: [internal]
      summary: Consume a batch from listings' queue (dedupe on eventId, per-aggregate version check, DLQ after 5 attempts)
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; every 20 s + poke from the producer relay)
      x-timeout-ms: 55000
      x-idempotency: Idempotent (processed_events dedupe)
      x-emits: [publication.changed.v1, audit.recorded.v1]
      parameters:
        - { name: queue, in: path, required: true, schema: { type: string, enum: [q_listings, q_listings_photos] } }
        - { name: batch, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /internal/v1/jobs/{name}:
    post:
      operationId: runJob
      tags: [internal]
      summary: Scheduled jobs
      description: |
        - `ceiling-sweep` (04:30 IST daily): recompute every ceiling after the nightly life-curve run; auto-downgrade where needed.
        - `projection-refresh`: rebuild public payloads after a settings or vocabulary change (batched, resumable).
        - `change-feed-prune` (daily): delete change-feed rows older than 30 days.
        - `idempotency-prune` / `rate-limit-prune` (hourly).
        - `api-key-expire` (every 5 min): end rotation grace periods.
      security: [{ cronSecret: [] }]
      x-roles: [scheduler]
      x-rate-limit: none (scheduler only; single-flight per job name)
      x-timeout-ms: 55000
      x-idempotency: Idempotent; each job is resumable from a stored checkpoint
      x-emits: [publication.changed.v1]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [ceiling-sweep, projection-refresh, change-feed-prune, idempotency-prune, rate-limit-prune, api-key-expire] } }
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ health
  /health/live:
    get:
      operationId: live
      tags: [health]
      security: []
      x-roles: [anonymous]
      x-rate-limit: none
      x-timeout-ms: 500
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200': { description: Process up, content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /health/ready:
    get:
      operationId: ready
      tags: [health]
      security: []
      x-roles: [anonymous]
      x-rate-limit: none
      x-timeout-ms: 1000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200': { description: 'DB reachable, migrations at expected version, vocabulary cached', content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: './_common.yaml#/components/schemas/Health' } } } }
components:
  parameters:
    PublicLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    PublicId:
      name: publicId
      in: path
      required: true
      description: Opaque public ID, `L-` + 10 Crockford base32 characters. Never the internal id or code.
      schema: { type: string, pattern: '^L-[0-9A-HJKMNP-TV-Z]{10}$' }
  responses:
    PublicationBlocked:
      description: |
        privacy-scan-blocked (findings in `errors[]` as {field, code=<finding kind>, message with offsets}),
        rera-missing (agent MahaRERA number not set, or project RERA number missing for Sale/Primary).
        Photo text is never a blocking reason (R-8).
      content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } }
    BatchResult:
      description: Batch processed
      content:
        application/json:
          schema:
            type: object
            required: [processed]
            properties:
              processed: { type: integer }
              failed: { type: integer }
              deadLettered: { type: integer }
              more: { type: boolean, description: More work is waiting (the scheduler may poke again) }
  schemas:
    CeilingReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [commercial_closed, commercial_inactive, retired_unwilling, life_expired, life_stale, life_paused, outside_launch_area,
                 not_verified, no_real_photos, project_rera_missing, agent_rera_missing, demand_not_sourcing, demand_exited, project_no_live_configuration,
                 merged, voided]
        message: { type: string, description: Plain-English reason shown on C-12 }
    PublicationBase:
      type: object
      required: [subjectType, subjectId, code, level, ceiling, ceilingReasons, allowedLevels, version, updatedAt]
      properties:
        subjectType: { type: string, enum: [offer, project, demand_post] }
        subjectId: { type: string, format: uuid }
        code: { type: string, description: 'Display code (INV-…, PRJ-…, DEM-…)' }
        level: { $ref: './_common.yaml#/components/schemas/PublicationLevel' }
        ceiling: { $ref: './_common.yaml#/components/schemas/PublicationLevel' }
        ceilingReasons: { type: array, items: { $ref: '#/components/schemas/CeilingReason' }, description: Why the ceiling is not higher (empty when ceiling = Public) }
        allowedLevels: { type: array, items: { $ref: './_common.yaml#/components/schemas/PublicationLevel' } }
        publicId: { type: [string, 'null'], description: Issued on first publish; kept for the life of the subject }
        label: { type: [string, 'null'], description: Generated display label (BRD §4.2) }
        lastChangedBy: { type: [string, 'null'], format: uuid }
        lastChangeReason: { type: [string, 'null'], enum: [user, ceiling_dropped, closed, retired, expired, merged, voided, null] }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    OfferPublicationState:
      allOf:
        - $ref: '#/components/schemas/PublicationBase'
        - type: object
          required: [inputs, rera, photos]
          properties:
            inputs:
              type: object
              description: Ceiling inputs as last received from events
              properties:
                lifeStage: { type: [string, 'null'], enum: [Fresh, Ageing, Stale, Expired, Paused, null] }
                recordStage: { type: [string, 'null'] }
                commercialStatus: { type: [string, 'null'] }
                hasRealPhotos: { type: boolean }
                outsideLaunchArea: { type: boolean }
            publicDescription: { type: [string, 'null'], maxLength: 2000 }
            descriptionSource: { type: string, enum: [generated, staff] }
            lastScan: { oneOf: [ { $ref: '#/components/schemas/PrivacyScanResult' }, { type: 'null' } ] }
            rera:
              type: object
              required: [agentNumberSet, projectReraRequired]
              properties:
                agentNumberSet: { type: boolean }
                projectReraRequired: { type: boolean }
                projectReraNumber: { type: [string, 'null'] }
            photos:
              type: array
              items:
                type: object
                required: [photoId, isReal, publicUse, ocrStatus]
                properties:
                  photoId: { type: string, format: uuid }
                  isReal: { type: boolean }
                  publicUse: { type: boolean, description: 'In the offer''s selectedPhotoIds (records) and processed; used when the item is Public' }
                  ocrStatus: { type: string, enum: [pending, clear, text_found, failed] }
                  warnings: { type: array, description: 'Warning only (R-8); never blocks or excludes', items: { type: string, enum: [text_detected, phone, email, url, building_name, wing_unit, other_text] } }
    ProjectPublicationState:
      allOf:
        - $ref: '#/components/schemas/PublicationBase'
        - type: object
          properties:
            projectReraNumber: { type: [string, 'null'] }
            liveConfigurations: { type: integer }
    DemandPostState:
      allOf:
        - $ref: '#/components/schemas/PublicationBase'
        - type: object
          properties:
            commercialStatus: { type: [string, 'null'] }
            lifeStage: { type: [string, 'null'] }
            sourcingRequestId: { type: [string, 'null'], format: uuid }
    PublicationSummary:
      type: object
      required: [subjectType, subjectId, code, level, ceiling, updatedAt]
      properties:
        subjectType: { type: string, enum: [offer, project, demand_post] }
        subjectId: { type: string, format: uuid }
        code: { type: string }
        level: { $ref: './_common.yaml#/components/schemas/PublicationLevel' }
        ceiling: { $ref: './_common.yaml#/components/schemas/PublicationLevel' }
        label: { type: [string, 'null'] }
        lifeStage: { type: [string, 'null'] }
        publicId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    SetPublicationRequest:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: { $ref: './_common.yaml#/components/schemas/PublicationLevel' }
        publicDescription:
          type: [string, 'null']
          maxLength: 2000
          description: Staff-edited public description (offers only). Omit to keep the current text; null resets to the generated one.
    PrivacyScanRequest:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 2000, description: Proposed public description; omit to scan the current effective text }
        includePhotos: { type: boolean, default: true }
    PrivacyScanFinding:
      type: object
      required: [kind, severity, field]
      properties:
        kind: { type: string, enum: [phone, email, url, social_handle, building_name, society_name, wing_unit, exact_floor, street_address, photo_text] }
        severity: { type: string, enum: [block, warn] }
        field: { type: string, enum: [description, photo] }
        start: { type: integer, description: Character offset in the scanned text (description findings) }
        end: { type: integer }
        photoId: { type: string, format: uuid }
    PrivacyScanResult:
      type: object
      required: [scanId, result, findings, scannedAt, rulesVersion]
      properties:
        scanId: { type: string, format: uuid }
        result: { type: string, enum: [pass, warning, blocked] }
        findings: { type: array, items: { $ref: '#/components/schemas/PrivacyScanFinding' } }
        rulesVersion: { type: string }
        scannedAt: { type: string, format: date-time }
    PublicationSettingsInput:
      type: object
      additionalProperties: false
      required: [mahareraAgentNumber]
      properties:
        mahareraAgentNumber: { type: string, pattern: '^[A-Z][0-9]{11}$', description: 'MahaRERA agent registration, e.g. A51900012345' }
        subjectToConfirmationNote: { type: string, maxLength: 120, default: Details subject to confirmation }
    PublicationSettings:
      allOf:
        - $ref: '#/components/schemas/PublicationSettingsInput'
        - type: object
          required: [version, updatedAt]
          properties:
            version: { type: integer }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: [string, 'null'], format: uuid }
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80, description: 'Site name, e.g. "11estates.in" or "PRJ-0031 microsite"' }
        allowedOrigins: { type: array, maxItems: 10, items: { type: string, format: uri }, description: Informational CORS allow-list for browser use }
        rateLimitRps: { type: integer, minimum: 1, maximum: 50, default: 50 }
        burst: { type: integer, minimum: 1, maximum: 100, default: 100 }
    ApiKey:
      type: object
      required: [keyId, name, prefix, status, createdAt]
      properties:
        keyId: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: 'First 8 characters, e.g. "lk_live_ab"; for identification only' }
        status: { type: string, enum: [active, rotating, revoked] }
        rateLimitRps: { type: integer }
        burst: { type: integer }
        allowedOrigins: { type: array, items: { type: string } }
        graceEndsAt: { type: [string, 'null'], format: date-time }
        replacedByKeyId: { type: [string, 'null'], format: uuid }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        revokedAt: { type: [string, 'null'], format: date-time }
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            secret: { type: string, description: 'Plaintext key (lk_live_ + 40 base62 chars). Returned once; only an HMAC-SHA-256 hash is stored.' }
    Photo:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: 'Public CDN URL of a sanitised copy (EXIF stripped, resized)' }
        width: { type: integer }
        height: { type: integer }
    PublicOfferBase:
      type: object
      description: Anonymous shape (PRD §8.3). Every field is generated or copied from stored fields; unknown = absent/null.
      required: [publicId, level, label, dealType, segment, agentReraNumber, publishedAt, updatedAt]
      properties:
        publicId: { type: string }
        level: { type: string, enum: [Anonymous, Public] }
        label: { type: string, description: 'Generated, e.g. "For Rent", "New Project, For Sale"' }
        headline: { type: string, description: 'Generated, e.g. "2 BHK Apartment · For Rent · Andheri West"' }
        dealType: { type: string, x-vocabulary: deal_type }
        market: { type: [string, 'null'], x-vocabulary: market }
        segment: { type: string, x-vocabulary: segment }
        propertyTypes: { type: array, items: { type: string, x-vocabulary: property_type } }
        bhkMin: { type: [number, 'null'] }
        bhkMax: { type: [number, 'null'] }
        city: { type: [string, 'null'] }
        micromarket: { type: [string, 'null'] }
        locality: { type: [string, 'null'] }
        areaSqftMin: { type: [number, 'null'] }
        areaSqftMax: { type: [number, 'null'] }
        areaBasis: { $ref: './_common.yaml#/components/schemas/AreaBasis' }
        landAreaSqft: { type: [number, 'null'] }
        salePriceInrMin: { type: [integer, 'null'] }
