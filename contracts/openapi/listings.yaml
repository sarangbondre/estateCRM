# listings — Publishing and Listings API (S5). LLD: docs/04-lld/listings.md
# Rules: docs/04-lld/conventions.md. Shared components: ./_common.yaml
openapi: 3.1.0
info:
  title: 11 Estates CRM — listings (Publishing and Listings API)
  version: 0.1.0
  description: |
    Owns the Publication axis (level + computed ceiling), privacy-scan results, the sanitised public projection of
    offers, projects and anonymous demand posts, the change feed, website API keys and the RERA publication settings.

    Two audiences:
    - **Staff** (via web, `staffViaWeb`): publication cards C-12 / C-11 toggle, Settings (API keys, RERA number).
    - **Website client** (11 Estates website and project microsites, `websiteApiKey`): read-only public API on the
      listings Vercel domain (`https://api.11estates.in`), not routed through web. Responses carry only the PRD §8.3
      fields. Never: building/society name, wing, unit, exact floor, street address, contacts, sources, internal notes,
      owners, side_evidence, needs_review data. Non-property scopes are never served.

    Public API caching: `Cache-Control: public, s-maxage=20, stale-while-revalidate=10` and `Vary: X-Api-Key` on
    GET list/detail responses (max staleness 30 s; NFR-10 ≤ 1 min end to end). `/v1/changes` is `s-maxage=5`.
    Errors are never cached.
servers:
  - url: https://api.11estates.in
    description: Public website API (listings Vercel project, bom1)
  - url: https://listings.internal.11estates.in
    description: Staff routes reached only through web; /internal routes reached only by pg_cron/pg_net
tags:
  - name: publication
    description: Staff publication control (C-12, C-11)
  - name: settings
    description: Admin settings owned by listings (RERA agent number, API keys)
  - name: public
    description: Website client API (US-33)
  - name: internal
    description: Scheduler endpoints (relay, drain, jobs)
  - name: health
security: []
paths:
  # ------------------------------------------------------------------ staff: publication
  /v1/offers/{idOrCode}/publication:
    parameters:
      - $ref: './_common.yaml#/components/parameters/IdOrCode'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getOfferPublication
      tags: [publication]
      summary: Publication state of an offer with the computed ceiling and the reasons (C-12, P-02 Overview)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200':
          description: Current state
          headers: { ETag: { schema: { type: string }, description: 'Row version; use as If-Match on PUT' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OfferPublicationState' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    put:
      operationId: setOfferPublication
      tags: [publication]
      summary: Set the publication level (at or below the ceiling), optionally with an edited public description
      description: |
        Runs the blocking privacy scan on the effective public text (generated or staff-edited) and the RERA check
        before Anonymous or Public. Photos come from the offer's `selectedPhotoIds` (chosen in records). Photos with
        detected text are a **warning only** (conventions R-8, PRD A-17): they're flagged in `photos[].warnings` and
        `lastScan`, nothing is excluded automatically. Lowering a level never needs a scan. Emits
        `publication.changed.v1` when the level changes and `audit.recorded.v1` (action `publication.set`) always.
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: PUT is idempotent by design (same body → same state, no second event). Optional If-Match → 412 on version mismatch.
      x-emits: [publication.changed.v1, audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetPublicationRequest' } } }
      responses:
        '200':
          description: Level applied (or unchanged)
          content: { application/json: { schema: { $ref: '#/components/schemas/OfferPublicationState' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { description: 'level-above-ceiling or subject-not-publishable', content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '412': { $ref: './_common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/PublicationBlocked' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/offers/{idOrCode}/privacy-scan:
    parameters:
      - $ref: './_common.yaml#/components/parameters/IdOrCode'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    post:
      operationId: scanOfferText
      tags: [publication]
      summary: Dry-run privacy scan of a proposed public description (and the offer's photos) without changing the level
      description: Stores the scan result (latest per offer is shown on C-12). Findings return kinds and character offsets only, never the matched text.
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key accepted (24 h, per user+route); replay returns the stored scan result
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyScanRequest' } } }
      responses:
        '200':
          description: Scan result (pass, warning or blocked)
          content: { application/json: { schema: { $ref: '#/components/schemas/PrivacyScanResult' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/projects/{idOrCode}/publication:
    parameters:
      - $ref: './_common.yaml#/components/parameters/IdOrCode'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getProjectPublication
      tags: [publication]
      summary: Publication state of a project (P-05) with ceiling and reasons
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200':
          description: Current state
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPublicationState' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    put:
      operationId: setProjectPublication
      tags: [publication]
      summary: Set a project's level (Private or Public; projects have no Anonymous level)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Supply agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: PUT is idempotent by design. Optional If-Match → 412.
      x-emits: [publication.changed.v1, audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetPublicationRequest' } } }
      responses:
        '200':
          description: Level applied
          content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPublicationState' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { description: level-above-ceiling, content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '412': { $ref: './_common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/PublicationBlocked' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/demands/{idOrCode}/demand-post:
    parameters:
      - $ref: './_common.yaml#/components/parameters/IdOrCode'
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getDemandPost
      tags: [publication]
      summary: Anonymous demand post state for a demand (P-03 Sourcing tab)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200':
          description: Current state
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/DemandPostState' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    put:
      operationId: setDemandPost
      tags: [publication]
      summary: Post (Anonymous) or take down (Private) the anonymous demand post; allowed only while the demand is in Sourcing and Fresh/Ageing
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: PUT is idempotent by design. Optional If-Match → 412.
      x-emits: [publication.changed.v1, audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [level]
              properties:
                level: { type: string, enum: [Private, Anonymous] }
      responses:
        '200':
          description: Applied
          content: { application/json: { schema: { $ref: '#/components/schemas/DemandPostState' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { description: 'level-above-ceiling (demand not in Sourcing, Stale/Expired or exited)', content: { application/problem+json: { schema: { $ref: './_common.yaml#/components/schemas/Problem' } } } }
        '412': { $ref: './_common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/PublicationBlocked' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/publications:
    get:
      operationId: listPublications
      tags: [publication]
      summary: Staff list of publication states (e.g. "Stale Public offers", everything Public), stored-field filters
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
        - $ref: './_common.yaml#/components/parameters/Limit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - { name: subjectType, in: query, schema: { type: string, enum: [offer, project, demand_post] } }
        - { name: level, in: query, schema: { $ref: './_common.yaml#/components/schemas/PublicationLevel' } }
        - { name: lifeStage, in: query, schema: { $ref: './_common.yaml#/components/schemas/LifeStage' } }
        - { name: ceilingBelowLevel, in: query, description: Only items whose ceiling is below the current level (should be empty; health check), schema: { type: boolean } }
      responses:
        '200':
          description: Page sorted by updatedAt desc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicationSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ staff: settings
  /v1/publication-settings:
    parameters:
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getPublicationSettings
      tags: [settings]
      summary: RERA agent number and listing notes shown on every item
      security: [{ staffViaWeb: [] }, { serviceToken: [] }]  # journeys reads the MahaRERA number for proposal PDFs
      x-roles: [Admin, Manager, Demand agent, Supply agent, Data operator]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      responses:
        '200':
          description: Settings
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicationSettings' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    put:
      operationId: putPublicationSettings
      tags: [settings]
      summary: Set the 11 Estates MahaRERA agent number and the "subject to confirmation" note (Admin)
      description: A change refreshes every public item (job `projection-refresh`) and adds `updated` entries to the change feed.
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: PUT is idempotent by design. Optional If-Match → 412.
      x-emits: [audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublicationSettingsInput' } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicationSettings' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '412': { $ref: './_common.yaml#/components/responses/PreconditionFailed' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/api-keys:
    parameters:
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listApiKeys
      tags: [settings]
      summary: List website API keys (metadata only; secrets are never returned after creation)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/Limit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - { name: status, in: query, schema: { type: string, enum: [active, rotating, revoked] } }
      responses:
        '200':
          description: Page sorted by createdAt desc, id
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
    post:
      operationId: createApiKey
      tags: [settings]
      summary: Create an API key for a website or microsite; the secret is returned once
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key accepted. A replay returns the original status and the key metadata with `secret` omitted (the plaintext secret is never stored, not even in the idempotency store).
      x-emits: [audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateApiKeyRequest' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyWithSecret' } } }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/api-keys/{keyId}/rotate:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    post:
      operationId: rotateApiKey
      tags: [settings]
      summary: Issue a replacement key; the old key stays valid for a grace period (default 168 h, max 720 h)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: Idempotency-Key accepted; replay returns the new key metadata without `secret`. Rotating a key that is already rotating → 409 conflict.
      x-emits: [audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                graceHours: { type: integer, minimum: 0, maximum: 720, default: 168 }
      responses:
        '201':
          description: New key issued
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyWithSecret' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  /v1/api-keys/{keyId}/revoke:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: './_common.yaml#/components/parameters/CorrelationId'
    post:
      operationId: revokeApiKey
      tags: [settings]
      summary: Revoke a key immediately (the edge cache entries for it expire within 30 s)
      security: [{ staffViaWeb: [] }]
      x-roles: [Admin]
      x-rate-limit: per user at web (20 req/s, burst 40)
      x-timeout-ms: 2000
      x-idempotency: Naturally idempotent (revoking a revoked key returns 200 with the same body); Idempotency-Key also accepted.
      x-emits: [audit.recorded.v1]
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiKey' } } }
        '401': { $ref: './_common.yaml#/components/responses/Unauthenticated' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '429': { $ref: './_common.yaml#/components/responses/TooMany' }
        '500': { $ref: './_common.yaml#/components/responses/ServerError' }
  # ------------------------------------------------------------------ public website API
  /v1/listings:
    get:
      operationId: publicListOffers
      tags: [public]
      summary: Published offers (Anonymous or Public shape per item), stored-field filters, cursor pagination (max 50)
      security: [{ websiteApiKey: [] }]
      x-roles: [Website client]
      x-rate-limit: 50 req/s, burst 100 per API key (token bucket enforced by listings itself, conventions R-1; cache hits are not counted)
      x-timeout-ms: 2000
      x-idempotency: safe (read-only)
      x-emits: []
      x-cache: 'public, s-maxage=20, stale-while-revalidate=10; Vary: X-Api-Key'
      parameters:
        - $ref: './_common.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - { name: dealType, in: query, schema: { type: string }, x-vocabulary: deal_type }
        - { name: market, in: query, schema: { type: string }, x-vocabulary: market }
        - { name: segment, in: query, schema: { type: string }, x-vocabulary: segment }
        - { name: propertyType, in: query, description: 'Matches if any of the item propertyTypes equals it', schema: { type: string }, x-vocabulary: property_type }
        - { name: city, in: query, schema: { type: string, maxLength: 80 } }
        - { name: micromarket, in: query, description: Includes child localities (hierarchy), schema: { type: string, maxLength: 80 } }
        - { name: locality, in: query, schema: { type: string, maxLength: 80 } }
        - { name: bhkMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: bhkMax, in: query, schema: { type: number, minimum: 0 } }
        - { name: areaSqftMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: areaSqftMax, in: query, schema: { type: number, minimum: 0 } }
