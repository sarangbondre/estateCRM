        - { name: locality, in: query, schema: { type: string, maxLength: 80 } }
        - { name: propertyType, in: query, schema: { type: string }, x-vocabulary: property_type }
        - { name: bhkMin, in: query, schema: { type: number, minimum: 0 } }
        - { name: bhkMax, in: query, schema: { type: number, minimum: 0 } }
        - { name: priceInrMax, in: query, description: 'Any configuration priceInrFrom ≤ this', schema: { type: integer, minimum: 0 } }
