name: web
on:
  pull_request:
    paths:
      [
        'services/web/**',
        'libs/**',
        'contracts/**',
        'pnpm-lock.yaml',
        '.github/workflows/_service-ci.yml',
        '.github/workflows/svc-web.yml',
      ]
  push:
    branches: [main]
    paths: ['services/web/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml']
jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: web
      path: services/web
      database: false
