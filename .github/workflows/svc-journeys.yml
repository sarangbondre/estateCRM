name: journeys
on:
  pull_request:
    paths:
      [
        'services/journeys/**',
        'libs/**',
        'contracts/**',
        'pnpm-lock.yaml',
        '.github/workflows/_service-ci.yml',
        '.github/workflows/svc-journeys.yml',
      ]
  push:
    branches: [main]
    paths: ['services/journeys/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml']
jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: journeys
      path: services/journeys
