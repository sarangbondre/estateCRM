# Switch on the database scheduler (pg_cron → each service's relay, drains and jobs) for the pilot. Run it by hand
# after deploy-database and once every service is healthy: Actions → "configure-scheduler" → Run workflow.
# Needs SUPABASE_DB_URL (as for deploy-database) and one secret per service with the same value as that service's
# <SERVICE>_CRON_SECRET in Vercel: WEB_CRON_SECRET, INTAKE_CRON_SECRET, RECORDS_CRON_SECRET, JOURNEYS_CRON_SECRET,
# CRM_ENGINE_CRON_SECRET, LISTINGS_CRON_SECRET, INSIGHT_CRON_SECRET. Safe to re-run; "off" pauses every schedule.
name: configure-scheduler
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "pilot" to configure the pilot database
        required: true
      domain:
        description: The site's address, without https://
        required: true
        default: estatecrm-nu.vercel.app
      schedules:
        description: on | off
        required: true
        default: 'on'
permissions:
  contents: read
concurrency:
  group: deploy-database
  cancel-in-progress: false
jobs:
  configure:
    if: github.event.inputs.confirm == 'pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure the scheduler (no secrets in logs)
        env:
          RAW: ${{ secrets.SUPABASE_DB_URL }}
          DOMAIN: ${{ github.event.inputs.domain }}
          SCHEDULES: ${{ github.event.inputs.schedules }}
          ENVIRONMENT_NAME: pilot
          WEB_CRON_SECRET: ${{ secrets.WEB_CRON_SECRET }}
          INTAKE_CRON_SECRET: ${{ secrets.INTAKE_CRON_SECRET }}
          RECORDS_CRON_SECRET: ${{ secrets.RECORDS_CRON_SECRET }}
          JOURNEYS_CRON_SECRET: ${{ secrets.JOURNEYS_CRON_SECRET }}
          CRM_ENGINE_CRON_SECRET: ${{ secrets.CRM_ENGINE_CRON_SECRET }}
          LISTINGS_CRON_SECRET: ${{ secrets.LISTINGS_CRON_SECRET }}
          INSIGHT_CRON_SECRET: ${{ secrets.INSIGHT_CRON_SECRET }}
        run: |
          if [ -z "$RAW" ]; then echo "::error::Add the SUPABASE_DB_URL repository secret first"; exit 1; fi
          case "$DOMAIN" in
            *[!a-z0-9.-]*|"") echo "::error::domain must be a bare host name such as estatecrm-nu.vercel.app"; exit 1 ;;
          esac
          export ADMIN_DATABASE_URL="${RAW%%\?*}?sslmode=no-verify"
          echo "::add-mask::$ADMIN_DATABASE_URL"
          # web serves its internal endpoints at the site root; the other services behind /svc/<service>.
          export WEB_BASE_URL="https://$DOMAIN"
          for svc in intake records journeys crm-engine listings insight; do
            export "$(echo "$svc" | tr a-z- A-Z_)_BASE_URL=https://$DOMAIN/svc/$svc"
          done
          node infra/scripts/configure-environment.mjs
