name: intake
on:
  pull_request:
    paths: ['services/intake/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml', '.github/workflows/_service-ci.yml', '.github/workflows/svc-intake.yml']
  push:
    branches: [main]
    paths: ['services/intake/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml']
jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: intake
      path: services/intake
