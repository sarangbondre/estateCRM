# Reusable per-service pipeline (CLAUDE.md §3.9, docs/06-implementation-rules.md §1.5).
name: service-ci (reusable)
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      path:
        required: true
        type: string
      database:
        description: Start the local Supabase Postgres (platform bootstrap applied) for integration tests
        required: false
        type: boolean
        default: true
jobs:
  ci:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        if: inputs.database
        with:
          version: 2.118.0
      - name: Local Postgres (platform bootstrap)
        if: inputs.database
        run: supabase --workdir infra db start && node infra/scripts/local-roles.mjs --env > /dev/null
      - name: Layer check
        run: pnpm exec depcruise ${{ inputs.path }} --config .dependency-cruiser.cjs
      - name: Lint, typecheck, tests (unit, integration, contract), build
        run: pnpm turbo run lint typecheck test build --filter "./${{ inputs.path }}"
