name: records
on:
  pull_request:
    paths: ['services/records/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml', '.github/workflows/_service-ci.yml', '.github/workflows/svc-records.yml']
  push:
    branches: [main]
    paths: ['services/records/**', 'libs/**', 'contracts/**', 'pnpm-lock.yaml']
jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service: records
      path: services/records
