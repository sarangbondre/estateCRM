# Repo-wide checks on every PR: secret scan, libs, formatting of generated artifacts.
name: repo
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact
  libs:
    name: libs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm exec depcruise services libs --config .dependency-cruiser.cjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: local Postgres for integration tests
        run: supabase --workdir infra db start && node infra/scripts/local-roles.mjs --env > /dev/null
      - run: pnpm turbo run build typecheck test --filter "./libs/*"
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: lint OpenAPI + validate AsyncAPI
        run: pnpm contracts:lint
      - name: generated artifacts match sources (no drift)
        run: pnpm contracts:check
      - run: pnpm --filter @11e/contracts run typecheck
      - name: contract mocks start and enforce auth
        run: pnpm mock:smoke
  db-platform:
    name: db-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: pnpm install --frozen-lockfile
      - name: start local Postgres with the platform bootstrap
        run: supabase --workdir infra db start
      - run: node infra/scripts/local-roles.mjs --env > /dev/null
      - name: verify schemas, roles, queues and isolation
        run: pnpm db:verify
