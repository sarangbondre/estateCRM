# Writes each app's AWS Secrets Manager secret from the pilot settings (CR-018). Run by hand after aws-infra created
# the secrets, and again whenever a setting changes (then redeploy the affected apps).
# Needs the repository secrets PILOT_ENV (the private pilot settings file, KEY=value lines) and HF_TOKEN.
name: aws-secrets
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "pilot" to write the pilot secrets
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  sync:
    if: github.event.inputs.confirm == 'pilot'
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Write secrets (key names only in the log)
        env:
          PILOT_ENV: ${{ secrets.PILOT_ENV }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node infra/aws/sync-secrets.mjs pilot
